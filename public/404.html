<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>APTA Empowers</title>
    <script>
      // GitHub Pages serves a real 404 for unknown paths (no server rewrite for
      // SPAs), so this fallback stages the requested route by redirecting to the
      // app root with the original path/query/hash packed into a single ?r=
      // parameter. Query params survive the extra document load that GitHub
      // Pages sometimes performs after the fallback redirect (sessionStorage did
      // not), and main.tsx consumes ?r= on boot, restores the route, and
      // rewrites the URL clean.
      ;(function () {
        var loc = window.location
        if (loc.pathname.indexOf('/APTA-funding') !== 0) return
        var dest =
          '/APTA-funding/?r=' +
          encodeURIComponent(
            loc.pathname.replace(/\/+$/, '') + loc.search + loc.hash
          )
        window.location.replace(dest)
      })()
    </script>
  </head>
  <body></body>
</html>
