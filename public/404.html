<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>APTA Empowers</title>
    <script>
      // GitHub Pages has no SPA rewrites: a deep link like /applications/123 lands here.
      // Send it to the app root with the path packed into ?r= (query params survive the
      // extra load Pages sometimes does); main.tsx restores the route and cleans the URL.
      ;(function () {
        var loc = window.location
        // Project site → /APTA-funding/, custom domain → /
        var base = loc.pathname.indexOf('/APTA-funding') === 0 ? '/APTA-funding/' : '/'
        var path = loc.pathname.replace(/\/+$/, '') || '/'
        window.location.replace(base + '?r=' + encodeURIComponent(path + loc.search + loc.hash))
      })()
    </script>
  </head>
  <body></body>
</html>
