name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. This makes one tiny,
# read-only request (the public totals) every 3 days so the database never pauses.
# Uses only the publishable key already in .env.production; costs nothing.

on:
  schedule:
    - cron: '17 3 */3 * *' # 03:17 UTC every third day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env.production
          sparse-checkout-cone-mode: false

      - name: Ping Supabase
        run: |
          set -euo pipefail
          URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$URL/rest/v1/rpc/apta_public_stats" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase responded."
